# QA practice INF-433: runs the JUnit and Selenium suites on GitHub's servers, so no local
# install is needed, and stores the per-step screenshots and test reports as downloadable artifacts.
name: qa-tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Environment versions
        run: |
          java -version
          ./mvnw -v
          google-chrome --version
          chromedriver --version

      - name: JUnit (unit tests)
        run: ./mvnw -B -Dspring-javaformat.skip=true -Dcheckstyle.skip=true test -Dtest=PetValidatorRulesTest

      - name: Selenium (UI tests)
        run: ./mvnw -B -Dspring-javaformat.skip=true -Dcheckstyle.skip=true test -Dtest=OwnerFlowSeleniumTest -Dexcluded.groups=none -Dselenium.headless=true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            target/screenshots/**/*.png
            target/surefire-reports/**
